name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter './packages/**' build

      # The Ruffle bundle (apps/desktop/public/ruffle/) is gitignored, so it is
      # absent on a fresh checkout. Copy it from the installed @ruffle-rs/ruffle
      # package BEFORE the web build so Vite copies public/ruffle/ -> dist/ruffle/
      # at the /dash/ base. Without this, /dash/ruffle/ruffle.js 404s on Pages.
      - name: Materialize Ruffle bundle
        run: node tools/copy-ruffle.mjs

      - name: Build web app
        run: pnpm --filter @flash/desktop run build
        env:
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
